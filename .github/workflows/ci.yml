name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

jobs:
  check:
    runs-on: namespace-profile-default
    steps:
      - uses: actions/checkout@v4

      - uses: cachix/install-nix-action@v27
        with:
          nix_path: nixpkgs=channel:nixos-unstable
          extra_nix_config: |
            experimental-features = nix-command flakes

      - uses: DeterminateSystems/magic-nix-cache-action@main

      - name: cargo fmt --check
        run: nix develop --command cargo fmt --check

      - name: cargo build
        run: nix develop --command cargo build --workspace --all-targets

      - name: cargo test
        run: nix develop --command cargo test --workspace

      - name: cargo clippy
        run: nix develop --command cargo clippy --workspace --all-targets -- -D warnings

  build:
    runs-on: namespace-profile-default
    steps:
      - uses: actions/checkout@v4

      - uses: cachix/install-nix-action@v27
        with:
          nix_path: nixpkgs=channel:nixos-unstable
          extra_nix_config: |
            experimental-features = nix-command flakes

      - uses: DeterminateSystems/magic-nix-cache-action@main

      - name: nix build pinhole-client
        run: nix build .#pinhole-client -L

      - name: nix build pinhole-todomvc-example
        run: nix build .#pinhole-todomvc-example -L

      - name: nix build pinhole-styling-showcase-example
        run: nix build .#pinhole-styling-showcase-example -L

  check-macos:
    runs-on: namespace-profile-macos
    steps:
      - uses: actions/checkout@v4

      - uses: DeterminateSystems/nix-installer-action@main

      - uses: DeterminateSystems/magic-nix-cache-action@main

      - name: cargo build
        run: nix develop --command cargo build --workspace --all-targets

      - name: cargo test
        run: nix develop --command cargo test --workspace

      - name: cargo clippy
        run: nix develop --command cargo clippy --workspace --all-targets -- -D warnings

  build-macos:
    runs-on: namespace-profile-macos
    steps:
      - uses: actions/checkout@v4

      - uses: DeterminateSystems/nix-installer-action@main

      - uses: DeterminateSystems/magic-nix-cache-action@main

      - name: nix build pinhole-client
        run: nix build .#pinhole-client -L

      - name: nix build pinhole-todomvc-example
        run: nix build .#pinhole-todomvc-example -L

      - name: nix build pinhole-styling-showcase-example
        run: nix build .#pinhole-styling-showcase-example -L
