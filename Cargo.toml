[workspace]
resolver = "2"
members = [
  'pinhole-protocol',
  'pinhole-client',
  'pinhole-framework',

  'examples/todomvc-example',
  'examples/styling-showcase-example'
]

[workspace.dependencies]
# Workspace crates
pinhole-protocol = { path = "pinhole-protocol" }
pinhole = { path = "pinhole-framework" }

# Async runtime
tokio = { version = "1.48", features = ["io-util", "net", "macros", "rt-multi-thread", "time", "sync", "signal"] }
tokio-stream = { version = "0.1", features = ["sync"] }
async-trait = "0.1"

# TLS
# default-features disabled on both: their defaults pull in aws-lc-rs, which
# needs a C/cmake build. `ring` keeps this a pure-Rust dependency chain.
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "logging", "tls12"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "logging", "std", "tls12"] }
rustls-pemfile = "2"
rustls-native-certs = "0.8"
rustls-pki-types = "1"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_cbor = "0.11"
serde_json = "1.0"

# Logging and tracing
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

# GUI
iced = { version = "0.14", features = ["tokio", "advanced"] }

# Utilities
futures = "0.3"
directories = "6.0"
rustc-hash = "2.1"
maplit = "*"
sha2 = "0.11"

# Dev dependencies
tempfile = "3.8"
